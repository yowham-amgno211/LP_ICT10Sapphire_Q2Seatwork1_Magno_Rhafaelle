<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">

    <title>Q2 Seatwork #1</title>

  <style>
body {
    background-color: #74afde; 
    color: #ffffff;            
    font-family: 'Rajdhani', sans-serif;
    padding: 20px;
    max-width: 400px;
    margin: 0 auto;           
}

header {
    margin-bottom: 20px;
    margin-top: 65px;
    text-align: center;
}

header h1 {
    font-size: 75px;
    margin: 0;
}

header p {
    color: #7e508c;           
    margin: 5px 0 0 0;
    font-size: 45px;
    font-weight: bold;
}

main {
    border-top: 5px solid #eccc2d;
    padding-top: 20px;
}

form {
    margin-bottom: 20px;
}

input[type="text"] {
    width: 100%;
    box-sizing: border-box;
    padding: 10px;
    margin-bottom: 10px;      
    background: floralwhite;   
    border: 2px solid #32588a; 
    color: #462166;
    font-size: 16px;
}

input[type="button"] {
    width: 100%;
    padding: 10px;
    background: #7e508c;      
    color: floralwhite;
    border: 2px solid #eccc2d; 
    font-size: 25px;
    font-weight: bold;
    cursor: pointer;
}

input[type="button"]:hover {
    background: #eccc2d;      
    color: #7e508c;      
}

#result {
    font-weight: bold;
    margin: 15px 0;
}

footer {
    margin-top: 40px;
    font-size: 20px;
    opacity: 0.7;
    text-align: center;
}

footer span {
    color: #ffd700;
}
    </style>


</head>
<body>

<header>
    <div class="reactor"></div>
    <h1>Glee Club Checker</h1>
    <p>Candidate Verification System</p>
</header>

<main> 
    <form> 
        <input type="text" id="first_name" placeholder="Enter your first name."> <br>
        <input type="text" id="last_name" placeholder="Enter your last name."> <br>
        <input type="button" py-click="candidate_checker" value="Enter"> <br>
    </form>

    <div id="result"></div>
</main>
    
<footer>&copy: 2026 <span>Glee Club </span> &bull; Seatwork #1 &bull; 2nd Quarter</footer> 

<py-script src="main.py"></py-script>    

</body>
</html>
